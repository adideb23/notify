<!DOCTYPE html><html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubber Stock Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }.dashboard-card {
        background: #ffffff;
        width: 85%;
        max-width: 400px;
        padding: 40px 25px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        text-align: center;
    }

    h1 {
        color: #2c3e50;
        font-size: 24px;
        margin-bottom: 30px;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
    }

    .btn {
        display: block;
        text-decoration: none;
        color: white;
        padding: 18px;
        margin-bottom: 15px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-entry { background-color: #673ab7; }
    .btn-view { background-color: #27ae60; }

    .btn:active {
        transform: scale(0.98);
    }

    .footer {
        margin-top: 25px;
        color: #7f8c8d;
        font-size: 13px;
    }
</style>

</head>
<body><div class="dashboard-card">
    <h1>Rubber Stock Management</h1>
    
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSds74IdzGSg2_s1t5yXocO9q16U7VOwGPWYh8FQDJqdX-xPMg/viewform" target="_blank" class="btn btn-entry">
        📝 Stock Entry
    </a>
    
    <a href="https://docs.google.com/spreadsheets/d/1dVWJf_Mr_uUeM7y6QQOguhXel9UZwuFpmaXRvJp6V8c/preview" target="_blank" class="btn btn-view">
        📊 View Stock
    </a>

    <div class="footer">
        Automated Inventory System
    </div>
</div>

</body>
</html>
